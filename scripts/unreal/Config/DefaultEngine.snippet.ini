; Merge these sections into <Project>/Config/DefaultEngine.ini (keep what the template already has).

[/Script/Engine.RendererSettings]
; Lumen for global illumination and reflections: no light baking, the level updates when the sun moves.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Hardware ray tracing: sharper Lumen reflections (mirrors, glossy floors) and better thin-wall occlusion.
; Mac needs Apple silicon and SM6 (METAL_SM6). The "Fast" quality preset turns it off at run time.
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
; Software Lumen fallback traces mesh distance fields.
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
; Reflections on glass (translucent front layer).
r.Lumen.TranslucencyReflections.FrontLayer.Enable=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=1
; Virtual shadow maps: crisp sun shadows indoors.
r.Shadow.Virtual.Enable=1
; Physical light units with auto exposure (sun 75 000 lux, lamps in lumens).
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
; TSR anti-aliasing (4).
r.AntiAliasingMethod=4
; Path tracer for offline-quality stills (R key, "still" route lines). Denoiser: plugin NNEDenoiser.
r.PathTracing=True
r.SkinCache.CompileShaders=True
; Many small lamps in one room overflowed the forward light grid (bright or dark blocks on the walls).
r.Forward.MaxCulledLightsPerCell=64
; Nanite stays enabled for the project, but import_manifest.py turns it off per mesh.
r.Nanite.ProjectEnabled=True

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Remote execution lets scripts/unreal/remote_run.py run Python in the open editor.
bRemoteExecution=True
RemoteExecutionMulticastGroupEndpoint=239.0.0.1:6766
; 0.0.0.0, not 127.0.0.1: macOS does not deliver the discovery multicast to a loopback-bound socket.
RemoteExecutionMulticastBindAddress=0.0.0.0
RemoteExecutionMulticastTtl=0

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Walkthrough.WalkGameMode
EditorStartupMap=/Game/Maps/Walkthrough.Walkthrough
GameDefaultMap=/Game/Maps/Walkthrough.Walkthrough

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
